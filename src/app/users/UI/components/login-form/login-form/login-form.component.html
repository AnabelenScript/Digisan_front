<div class="wrapper">
  <div class="card-switch">
      <label class="switch">
         <input type="checkbox" class="toggle">
         <span class="slider"></span>
         <span class="card-side"></span>
         <div class="flip-card__inner">
            <div class="flip-card__front">
               <div class="title">Log in</div>
               <form class="flip-card__form" action="">
                  <input class="flip-card__input" name="Email" placeholder="Email" type="email" [(ngModel)]="user.Email">
                  <input class="flip-card__input" name="Contrasena" placeholder="Password" type="password" [(ngModel)]="user.Contrasena" >
                  <button class="btn" type="button" (click)="login()">Inicia Sesión</button>
               </form>
            </div>
            <div class="flip-card__back">
               <div class="title">Sign up</div>
               <form class="flip-card__form" action="">
                  <input class="flip-card__input" name="Nombre" placeholder="Name" type="text" [(ngModel)]="user.Nombre">
                  <input class="flip-card__input" name="Email" placeholder="Email" type="email" [(ngModel)]="user.Email">
                  <input class="flip-card__input" name="Contrasena" placeholder="Password" type="password" [(ngModel)]="user.Contrasena">
                  <button type="button" class="btn" (click)="register()">Confirmar</button>
               </form>
            </div>
         </div>
      </label>
  </div>   
</div>
